<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Anti-Brainrot mark: a leaf whose silhouette is a play triangle pointing right.
       Navy ink for light backgrounds.
       One path, two subpaths, evenodd fill rule:
       subpath 1 (M 165 110 ... Z) is the blade, drawn clockwise from the top
       left corner: top edge, tip, bottom edge, base, stem, base, corner.
       subpath 2 (M 117 238 ... Z) is the midrib, a tapered sliver that the
       evenodd rule cuts out of the blade so the background shows through. -->

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Restore the CRX signing key
        env:
          CRX_KEY_PEM: ${{ secrets.CRX_KEY_PEM }}
        run: |
          if [ -n "$CRX_KEY_PEM" ]; then
            printf '%s\n' "$CRX_KEY_PEM" > "$RUNNER_TEMP/key.pem"
            echo "ABR_CRX_KEY=$RUNNER_TEMP/key.pem" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $GITHUB_REF_NAME" > notes.md; fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" $(ls dist/*.zip dist/*.crx 2>/dev/null) --title "$GITHUB_REF_NAME" --notes-file notes.md
